<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hidden Leaf Village Explorer</title>
    <style>
      :root {
        --bg: #0e1a12;
        --panel: rgba(0, 0, 0, 0.5);
        --text: #f4f0de;
        --accent: #e7a14f;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      canvas {
        display: block;
      }

      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 10;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
        backdrop-filter: blur(4px);
      }

      #msg {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 16, 12, 0.88);
        color: var(--text);
        text-align: center;
        z-index: 20;
        cursor: pointer;
      }

      #msg > div {
        max-width: 560px;
        padding: 28px;
      }

      h1 {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0.4rem 0;
        line-height: 1.5;
      }

      kbd {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 6px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.2);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="hud">Loading Konoha...</div>
    <div id="msg">
      <div>
        <h1>Hidden Leaf Village</h1>
        <p><kbd>W A S D</kbd> move &nbsp; <kbd>Shift</kbd> sprint &nbsp; <kbd>Space</kbd> jump</p>
        <p><kbd>Mouse</kbd> look around</p>
        <p><strong>Click to play</strong></p>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
